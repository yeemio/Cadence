# Cadence 双形态部署栈（ADR-0005：同一代码，单机买断 ↔ SaaS 订阅）。
#
# 形态切换（取舍写明：compose 单文件内 profile 不能改同一服务的 env，
# 故租户模式走 env 插值 + saas profile 承载 SaaS 独有结构，两者叠加 = SaaS 形态）：
#   单机（默认）：docker compose -f deploy/compose.yaml up
#     —— 服务全部无 profile 标签，SMES_TENANT_MODE 缺省 single-node。
#   SaaS：SMES_TENANT_MODE=saas SMES_DOMAIN=smes.example.com \
#         docker compose -f deploy/compose.yaml --profile saas up
#     —— 叠加子域反向代理（proxy，saas profile 独有 = DOMAIN 配置入口）。
#
# M4 正式线（已接通，见 deploy/README.md）：
#   - server/web 真实 build（Dockerfile 多阶段，运行镜像零 dev 工具；
#     上下文裁剪 = 各 Dockerfile.dockerignore，per-Dockerfile 形态）
#   - migrate 一次性服务：superuser 侧 prisma migrate deploy +
#     _prisma_migrations 对 app_user 只读收口（迁移不走 app_user）
#   - server RLS session 接线：SMES_RLS_SESSION=on（连接工厂扩展，
#     每个存储操作在事务内先 SET app.current_tenant 再执行）
#   - hostBased 租户解析接线：SMES_TENANT_MODE=saas 时 server 侧
#     hostBasedTenantResolver({domain: SMES_DOMAIN, lookup: SMES_TENANTS})，
#     请求租户经 runWithRlsTenant 传入 store 侧 RLS 会话上下文
#   - 生产要素初版：server/web healthcheck（server /health、web 静态入口）、
#     restart: unless-stopped（migrate 一次性恒 no）、pg-data 具名卷
name: cadence

services:
  pg:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadenceSingleNodeDev}
      POSTGRES_DB: cadence
      # 受限 app 用户口令（pg-init/01-app-user.sh 以 psql \set 绑定消费，不进 heredoc 拼接）
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-app_user_dev_change_me}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    # 低危清偿（取舍写明）：PG 端口不再对宿主全网发布，改绑 127.0.0.1——
    # 栈内服务走 compose 内网（pg:5432），宿主仅本机可达（迁移排障/psql 连查）；
    # 不选纯 expose（无宿主发布）：单机买断形态的运维需要本机直连能力。
    ports:
      - "127.0.0.1:${PG_PORT:-55432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cadence"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 一次性迁移服务（取舍写明）：迁移恒以 superuser 跑（pg-init 时序：业务表
  # 晚于 initdb 由迁移创建，default privileges 已对 app_user 授权 DML）；迁移
  # 完成后把 _prisma_migrations 台账对 app_user 收口为只读——运行时凭据无权
  # 改写迁移历史。target=migrate 含 prisma CLI（dev 工具仅存在于此 target，
  # server 运行镜像不含）。
  migrate:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: migrate
    depends_on:
      pg:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-cadenceSingleNodeDev}@pg:5432/cadence
      # D-16：seed 按租户清单幂等建 MAIN 默认仓（与 server 同源 SMES_TENANTS；
      # 单机缺省空清单 = 只种 default 租户，行为不变）。
      SMES_TENANTS: ${SMES_TENANTS:-}
    command:
      - sh
      - -ec
      - |
        pnpm --filter @smes/business-store exec prisma migrate deploy --schema prisma/schema.prisma
        pnpm --filter @smes/business-store run db:seed
        printf 'REVOKE INSERT, UPDATE, DELETE ON "_prisma_migrations" FROM app_user;' \
          | pnpm --filter @smes/business-store exec prisma db execute --url "$$DATABASE_URL" --stdin
        echo '[migrate] 迁移入库 + 种子 + _prisma_migrations 对 app_user 只读收口 完成'
    restart: "no"

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    depends_on:
      pg:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # DATABASE_URL 用受限 app 用户（合同口径）：RLS 就位后是行级隔离的安全
      # 边界（deploy/README 威胁模型限定句）。
      DATABASE_URL: postgresql://app_user:${POSTGRES_APP_PASSWORD:-app_user_dev_change_me}@pg:5432/cadence
      # RLS session 接线（M4 收尾波 ESCALATION-2）：连接工厂扩展逐操作 SET
      # 事务级变量；全部 18 家 connect* 工厂已接线（先例四家 org/masterdata/
      # workbench/approval + 其余十四家各领域 pg-*-stores）。事务/raw 入口的
      # 原子性边界见 business-store src/rls-session.ts 已知边界节。
      SMES_RLS_SESSION: "on"
      # 双形态开关：single-node（缺省）| saas——server 侧 main.ts 消费：
      # saas → hostBasedTenantResolver（SMES_DOMAIN 基域 + SMES_TENANTS 已知
      # 租户清单，未知租户 fail-closed；两项缺省即拒绝启动 fail-fast）；
      # single-node → 不触碰解析器，恒 'default'（零行为变化）。
      SMES_TENANT_MODE: ${SMES_TENANT_MODE:-single-node}
      # DOMAIN 配置入口（SaaS 形态）：子域名 → 租户解析的基域；单机形态留空。
      SMES_DOMAIN: ${SMES_DOMAIN:-}
      # 已知租户清单（SaaS 形态）：逗号分隔静态列表（租户管理流程属 M4 后续波）。
      SMES_TENANTS: ${SMES_TENANTS:-}
      # D-16：inventory 默认仓（采购收货等未显式指定 warehouseId 时的落位仓）。
      # 值 = 仓 code，命令期在租户内按 (tenant, code) 解析（全局单值 id 只对
      # 一个租户有效，已废）；seed 按 SMES_TENANTS 每租户幂等建 MAIN，缺省
      # MAIN 即开箱回落各租户自己的 MAIN。空串/未配 = 无默认仓，收货载荷须
      # 显式传 warehouseId（显式仓优先于 env 默认仓）。
      SMES_DEFAULT_WAREHOUSE_CODE: ${SMES_DEFAULT_WAREHOUSE_CODE-MAIN}
      # D-25：S6 配件审批链级数（1|2|3，缺省/空 = 1 单级零回归）；>1 时须配
      # SMES_PARTS_LEVEL2_ROLE（levels=3 另须 SMES_PARTS_LEVEL3_ROLE，角色码
      # 单段小写）——配错启动即炸（fail-fast，不静默回落单级）。
      SMES_PARTS_APPROVAL_LEVELS: ${SMES_PARTS_APPROVAL_LEVELS:-}
      SMES_PARTS_LEVEL2_ROLE: ${SMES_PARTS_LEVEL2_ROLE:-}
      SMES_PARTS_LEVEL3_ROLE: ${SMES_PARTS_LEVEL3_ROLE:-}
      # 模块启停透传（缺省=注册表 DEFAULT_MODULES_ENABLED 基础六模块；全量演示
      # 用 MODULES_ENABLED 显式传全清单——注册表 MODULE_DEFINITIONS 键，core 恒必装）。
      MODULES_ENABLED: ${MODULES_ENABLED:-}
    ports:
      - "${SERVER_PORT:-3000}:3000"
    restart: unless-stopped
    # 生产要素（M4 收尾波·双写去重）：server 不定义 compose 级 healthcheck——
    # 缺省继承镜像内 HEALTHCHECK（探针脚本 apps/server/dist/healthcheck-probe.js
    # 单份；Host 推导取舍见 apps/server/src/healthcheck-probe.ts 文件头：saas
    # 形态首个已知租户+SMES_DOMAIN、单机回落 127.0.0.1）。web 的 depends_on
    # service_healthy 据该镜像级 healthcheck 门控（compose 语义：服务级未
    # 覆盖即用镜像定义）。

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    # 生产要素（M4 初版）：静态入口自证（对齐镜像内 HEALTHCHECK；不探 /health——
    # 反代路径会把 server 故障混入 web 自身健康判定，职责分开判）。
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  # SaaS 独有：子域反向代理（DOMAIN 入口的实体落点）。
  # 透传 Host，租户识别在 server 侧（hostBasedTenantResolver，M4 正式线已接线）。
  proxy:
    image: nginx:1.27-alpine
    profiles: ["saas"]
    depends_on:
      - server
    ports:
      - "${PROXY_PORT:-80}:80"
    restart: unless-stopped
    configs:
      - source: saas_proxy_conf
        target: /etc/nginx/conf.d/default.conf

volumes:
  pg-data:

configs:
  saas_proxy_conf:
    # SMES_DOMAIN 需在 SaaS 形态显式设置（.env 或环境变量），
    # 否则 server_name 正则为空串（proxy 仅在 saas profile 下运行）。
    content: |
      server {
        listen 80;
        server_name ~^.+\.${SMES_DOMAIN:-invalid.invalid};
        location / {
          proxy_pass http://server:3000;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-Host $$host;
        }
      }
