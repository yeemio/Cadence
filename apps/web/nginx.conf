# Cadence web 静态服务（对齐 vite preview 行为：vite.config.ts 的服务端对应物）。
#
# - MPA 双入口（appType: 'mpa'）+ 导航级 SPA 深链回落（UX 缺陷批
#   UX-VW-04/UX-VW-03/UX-WH-13）：未命中静态文件的请求按形态分流——浏览器
#   文档导航（Accept 含 text/html）回落主壳 index.html，页面路由由前端 SPA
#   处理登录/权限/404（BrowserRouter + NotFoundPage）；fetch/XHR 等 API 请求
#   （Accept 不含 text/html）照旧反代 server，行为零变化。页面路由与 API 路径
#   同名撞车（/inventory/warehouses、/inventory/stock）时按请求形态各取所需：
#   导航进 SPA、数据请求进 API。注：vite preview（dev 形态）无此回落——dev 下
#   深链仍 404，取舍见 vite.config.ts mobileRouteFallback 注释（改 dev 语义
#   超出 UX 缺陷批范围）。
# - /login 友好路径 → /login.html（loginPathRewrite 的 nginx 对应；query 原样保留）。
# - /m 与 /m/（mobileRouteFallback 的 nginx 对应）：移动路由组是纯客户端路由
#   （无同名静态文件/API 路径），manifest start_url='/m' 安装态直达依赖文档
#   可达——窄域回落主壳 index.html。精确 /m + 前缀 /m/ 两条规则，不吞
#   /manifest.webmanifest 等 /m 开头的其他文件。
# - 未命中静态文件且非文档导航的路径（/health /org /auth …server 路由）反代
#   server:3000：VITE_API_BASE_URL 缺省 ''=同源，浏览器 API 请求经此代理到达
#   后端（取舍：vite preview 无代理、API 走跨源；容器栈选同源代理免 CORS 配置）。
# - 哈希资产长缓存（/assets/ 文件名自带版本）；sw.js / manifest 不缓存
#   （SW 更新即时性优先）。
#
# CM-1 安全响应头（M2 安全前置批波 b，SP-6 评估 §CM-1 落地）——本层（web
# nginx）是**静态+SPA 承载层的权威层**：HTML 页面必须真收到安全头，不能只在
# JSON API 生效；server 直连拓扑（SaaS 子域/IP:3000）由 main.ts 全局中间件
# 同值补头，两种拓扑浏览器都覆盖。CSP 按 apps/web 实际加载实态定制（非示例
# 复制；server main.ts SECURITY_RESPONSE_HEADERS 同值单份口径，改动两处同步）：
#   - script-src 'self' + sha256(vite-plugin-pwa injectRegister:'inline' 注入的
#     SW 注册内联脚本；index.html 与 login.html 同串，插件版本不变即稳定——
#     升级 vite-plugin-pwa 或改 sw 路径/scope 须重算哈希，失配症状 = SW 注册
#     被 CSP 拦截（控制台报错，应用本身不受影响）；
#   - style-src 'self' + sha256(offline.html 内联 <style>——纯静态离线壳)；
#   - img-src data:(位图/SVG data URI) + blob:(html5-qrcode 扫描帧图)；
#   - worker-src blob:(papaparse 由 Blob URL 构造 Web Worker)；
#   - connect-src 'self'(VITE_API_BASE_URL 缺省 ''=同源；SSE 同源)——若部署
#     改为他源 API（VITE_API_BASE_URL 指向跨源），此处须同步扩 connect-src；
#   - 不放开 'unsafe-inline'/'unsafe-eval'（dist 实测无 eval；除上述两处
#     哈希化的内联外无游离内联 script/style）。
# 注：nginx add_header 继承规则——location 内出现任何 add_header 即不再继承
# 上层；故 /assets/、= /sw.js、= /index.html 三处带自有缓存头的 location 须
# 重复安全头四行（server 级一份 + 三处重复，同值维护）。
#
# PUR-R2-03（M2 交付 Round-2 探查结论落地）：深链文档导航命中 @spa_or_server
# 的 rewrite → /index.html，该响应原带 ETag 无 Cache-Control 无 Vary:Accept，
# 浏览器按 URL 启发式缓存 HTML；后续同路径 fetch（默认 cache 模式）复用缓存
# HTML → JSON 解析失败「形状非法」（换 ?round2= 缓存键即恢复——SW 已排除，
# navigateFallback null）。修复：index.html 服务响应（含 SPA 回落/根导航/m·
# bigscreen 回落——全部经 location = /index.html）加 Cache-Control: no-cache
# （强制协商重验证，ETag 驱动 304）+ Vary: Accept（导航与 API 请求分缓存条目，
# 同 URL 双形态不再互串）。静态资产缓存策略不动（/assets/ 长缓存如旧）。

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # CM-1 安全响应头（server 级——无自有 add_header 的 location（含
  # @spa_or_server 反代的 API 响应）继承此组；always = 4xx/3xx 也带）。
  # 反代 API 响应会与 server 中间件所设同值头叠加（双份同值，浏览器取交集
  # 无语义变化）。
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-l0IHPvf8eV52c9mPJymShDKYQmoP/YyzUHeE31FDYIs='; style-src 'self' 'sha256-YtOWrAqaz/Nyg+osXB9QQeza3DEx372rEodcEB9gJ5o='; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  location = /login {
    rewrite ^/login$ /login.html last;
  }

  # 根文档 /：rewrite last 重进 location 匹配统一收口 location = /index.html
  # （PUR-R2-03：try_files 命中目录在当前上下文直出——不重匹配，协商缓存头
  # 会漏；root 壳与其他 SPA 回落同等处理；query 原样保留）。
  location = / {
    rewrite ^ /index.html last;
  }

  # 移动路由组文档回落（mobileRouteFallback 对应物，取舍见文件头注释）——
  # 同因 rewrite last 收口 = /index.html（此前 try_files 字面中置参在当前
  # 上下文直出，PUR-R2-03 协商缓存头同样漏；query 原样保留）。
  location = /m {
    rewrite ^ /index.html last;
  }

  # /bigscreen（O-1 大屏页路由组，纯客户端路由无静态文件/API 撞名——同 /m 窄域回落）
  location = /bigscreen {
    return 302 /bigscreen/digital-operation;
  }

  location ^~ /bigscreen/ {
    try_files $uri /index.html;
  }

  location ^~ /m/ {
    rewrite ^ /index.html last;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    # CM-1 安全头重复（本 location 有自有 add_header，断继承——见文件头注）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-l0IHPvf8eV52c9mPJymShDKYQmoP/YyzUHeE31FDYIs='; style-src 'self' 'sha256-YtOWrAqaz/Nyg+osXB9QQeza3DEx372rEodcEB9gJ5o='; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
    # CM-1 安全头重复（同上——断继承补偿）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-l0IHPvf8eV52c9mPJymShDKYQmoP/YyzUHeE31FDYIs='; style-src 'self' 'sha256-YtOWrAqaz/Nyg+osXB9QQeza3DEx372rEodcEB9gJ5o='; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri =404;
  }

  # SPA 主壳服务的统一收口（PUR-R2-03）：/ 与 /xxx/ 目录式导航（try_files
  # $uri/index.html 内部重定向）、/m /m/ /bigscreen/ 回落、@spa_or_server
  # 深链 rewrite 全部经此——HTML 壳恒协商重验证（ETag 304），导航与 API
  # 请求按 Accept 分缓存条目（根因即两形态共用一条启发式缓存）。
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header Vary "Accept";
    # CM-1 安全头重复（同上——断继承补偿）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-l0IHPvf8eV52c9mPJymShDKYQmoP/YyzUHeE31FDYIs='; style-src 'self' 'sha256-YtOWrAqaz/Nyg+osXB9QQeza3DEx372rEodcEB9gJ5o='; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }

  location / {
    try_files $uri $uri/index.html @spa_or_server;
  }

  # 未命中静态文件的兜底分流（取舍见文件头注释；rewrite last 重进 location
  # 匹配后由 location = /index.html 收口（PUR-R2-03 协商缓存修复点），query
  # 由 nginx 原样保留）。
  location @spa_or_server {
    # 浏览器文档导航（Accept 含 text/html）→ SPA 主壳深链回落
    if ($http_accept ~* "text/html") {
      rewrite ^ /index.html last;
    }
    # 其余（fetch/XHR/脚本 API 请求）→ 反代 server（行为不变）
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
