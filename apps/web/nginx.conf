# Cadence web 静态服务（对齐 vite preview 行为：vite.config.ts 的服务端对应物）。
#
# - MPA 双入口（appType: 'mpa'）：不做 SPA history fallback——深链未命中即 404，
#   与 vite preview 一致；导航离线兜底由 PWA ServiceWorker 承担（NetworkFirst +
#   /offline.html precache，见 vite.config workbox 配置）。
# - /login 友好路径 → /login.html（loginPathRewrite 的 nginx 对应；query 原样保留）。
# - /m 与 /m/（mobileRouteFallback 的 nginx 对应）：移动路由组是纯客户端路由
#   （无同名静态文件/API 路径），manifest start_url='/m' 安装态直达依赖文档
#   可达——窄域回落主壳 index.html；其余深链仍按"未命中反代"语义。精确 /m +
#   前缀 /m/ 两条规则，不吞 /manifest.webmanifest 等 /m 开头的其他文件。
# - 未命中静态文件的路径（/health /org /auth …server 路由）反代 server:3000：
#   VITE_API_BASE_URL 缺省 ''=同源，浏览器 API 请求经此代理到达后端
#   （取舍：vite preview 无代理、API 走跨源；容器栈选同源代理免 CORS 配置）。
# - 哈希资产长缓存（/assets/ 文件名自带版本）；sw.js / manifest 不缓存
#   （SW 更新即时性优先）。

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = /login {
    rewrite ^/login$ /login.html last;
  }

  # 移动路由组文档回落（mobileRouteFallback 对应物，取舍见文件头注释）
  location = /m {
    try_files /index.html =404;
  }

  # /bigscreen（O-1 大屏页路由组，纯客户端路由无静态文件/API 撞名——同 /m 窄域回落）
  location = /bigscreen {
    return 302 /bigscreen/digital-operation;
  }

  location ^~ /bigscreen/ {
    try_files $uri /index.html;
  }

  location ^~ /m/ {
    try_files /index.html =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/index.html @server;
  }

  location @server {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
